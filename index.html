<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON RUSH — V4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="screen-menu" class="screen active">
    <div class="menu-bg"></div>
    <div class="logo-block">
      <div class="logo">NEON <span>RUSH</span></div>
      <div class="logo-sub">SPEED // REACTION // RHYTHM</div>
    </div>
    <div class="main-menu">
      <button class="btn btn-main" data-action="play">JOGAR</button>
      <button class="btn" data-action="levels">FASES</button>
      <button class="btn" data-action="settings">CONFIGURAÇÕES</button>
    </div>
    <div class="menu-footer">SEGURE ESPAÇO / W / CLIQUE = PULO CONTÍNUO • SHIFT / X = DASH • R = REINICIAR • ESC = PAUSAR</div>
  </section>

  <section id="screen-levels" class="screen hidden">
    <header class="page-header">
      <button class="back" data-action="menu">← VOLTAR</button>
      <div><div class="micro">NEON RUSH</div><h1>SELECIONE SUA CORRIDA</h1></div>
      <div id="progressSummary" class="summary"></div>
    </header>
    <div id="levelGrid" class="level-grid"></div>
  </section>

  <section id="screen-settings" class="screen hidden">
    <header class="page-header">
      <button class="back" data-action="menu">← VOLTAR</button>
      <div><div class="micro">NEON RUSH</div><h1>CONFIGURAÇÕES</h1></div><div></div>
    </header>
    <div class="settings-card">
      <label>VOLUME <input id="volume" type="range" min="0" max="1" step="0.05"></label>
      <label>EFEITOS SONOROS <input id="sfx" type="checkbox"></label>
      <label>PARTÍCULAS <input id="particles" type="checkbox"></label>
      <label>EFEITO DE IMPACTO <input id="shake" type="checkbox"></label>
      <button class="btn danger" data-action="reset">APAGAR PROGRESSO</button>
    </div>
  </section>

  <section id="screen-game" class="screen hidden game-screen">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="hud-title" id="levelTitle">FASE 1 — PULSO ZERO</div>
      <div class="progress-wrap"><div class="progress-track"><i id="progressFill"></i></div></div>
      <div class="hud-progress" id="progressText">0%</div>
      <div class="hud-stats"><span>◆ <b id="coinText">0</b></span><span>★ <b id="scoreText">0</b></span><span id="speedText">6.8×</span><button class="pause" data-action="pause">Ⅱ</button></div>
    </div>
    <div id="tutorial" class="tutorial">PULE NO RITMO DOS BLOCOS</div>
    <div id="toast" class="toast hidden"></div>
    <div id="pause" class="modal hidden">
      <div class="modal-card"><div class="micro">NEON RUSH</div><h2>PAUSADO</h2><button class="btn btn-main" data-action="resume">CONTINUAR</button><button class="btn" data-action="restart">REINICIAR</button><button class="btn" data-action="levels">SAIR PARA FASES</button></div>
    </div>
    <div id="result" class="modal hidden">
      <div class="modal-card"><div id="resultKicker" class="micro">RESULTADO</div><h2 id="resultTitle">VOCÊ VENCEU!</h2><p id="resultText"></p><button id="nextBtn" class="btn btn-main">PRÓXIMA FASE</button><button class="btn" data-action="levels">SELECIONAR FASE</button></div>
    </div>
  </section>
</div>
<script src="game.js"></script>
</body>
</html>
